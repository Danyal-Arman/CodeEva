name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  # GitHub creates a virtual machine to run your code.
  build:
    runs-on: ubuntu-latest
    
    env:
      SECRET_KEY:     ${{ secrets.SECRET_KEY }}
      SMTP_USER:      ${{ secrets.SMTP_USER }}
      SMTP_PASS:      ${{ secrets.SMTP_PASS }}
      SENDER_EMAIL:   ${{ secrets.SENDER_EMAIL }}

    steps:
      # 1. Get your code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # ---------------- BACKEND ----------------
      - name: Install backend dependencies
        run: |
          cd server
          npm install

      - name: Run backend lint
        run: |
          cd server
          npm run lint

      - name: Run backend tests
        run: |
          cd server
          npm test

      # ---------------- FRONTEND ----------------
      - name: Install frontend dependencies
        run: |
          cd client
          rm -rf node_modules package-lock.json
          npm install

      - name: Build frontend
        run: |
          cd client
          npm run build


         # -------------- ENV VARS --------------

        